<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!-- Painted by the OS around the app: the Android status bar, and the tab
         strip in a browser. The value here is only the first frame — from the
         moment the app mounts, src/components/SystemBars.jsx rewrites it on
         every screen with the colour actually painted against the top edge, so
         a blue banner gets a blue bar and a plain page gets the page. The
         inline script below sets the right starting point for the saved
         theme. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Share books with your community. Borrow, lend, and discover new reading experiences." />
    <meta name="keywords" content="books, sharing, community, library, reading" />
    <meta name="author" content="OquNet" />
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iOS has no runtime equivalent of theme-color. "default" tracks the page
         instead of forcing white-on-transparent text over a light background,
         which is what "black-translucent" was doing. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OquNet" />
    
    <!-- App Icons -->
    <link rel="icon" type="image/svg+xml" href="/drawable/logo.svg" />
    <link rel="apple-touch-icon" href="/drawable/logo.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="/drawable/logo.svg" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="OquNet — Book Sharing Community" />
    <meta property="og:description" content="Share books with your community. Borrow, lend, and discover new reading experiences." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://oqunet.app" />
    
    <title>OquNet — Book Sharing Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Anti-flash: apply saved theme before first paint to avoid white flash.
         The system bars are set here too — Android reads theme-color and the
         page's color-scheme at load, so leaving them to React would show a
         white status bar for one frame on a dark launch. The navigation bar
         follows the root element's background for the same reason; both are
         handed over to SystemBars.jsx as soon as it mounts. -->
    <script>
      (function() {
        var dark = localStorage.getItem('theme') === 'dark';
        if (dark) document.documentElement.classList.add('dark');
        // Must match --bg-base in src/index.css.
        var base = dark ? '#0D1420' : '#ffffff';
        var bar = document.querySelector('meta[name="theme-color"]');
        if (bar) bar.setAttribute('content', base);
        document.documentElement.style.backgroundColor = base;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(registration) {
              console.log('Service Worker registered successfully:', registration);
              
              // Check for updates periodically
              setInterval(function() {
                registration.update().catch(function(err) {
                  console.warn('Failed to check for service worker updates:', err);
                });
              }, 60000); // Check every 60 seconds
            })
            .catch(function(err) {
              console.warn('Service Worker registration failed:', err);
            });
          
          // Handle service worker controller change (updated)
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            console.log('Service Worker updated, page will reload');
            // You can show a notification to the user here
          });
        });
      }
      
      // Detect if app is installed
      window.addEventListener('beforeinstallprompt', function(event) {
        event.preventDefault();
        window.deferredInstallPrompt = event;
        console.log('App can be installed');
      });
      
      window.addEventListener('appinstalled', function() {
        console.log('App was installed');
        if (window.deferredInstallPrompt) {
          window.deferredInstallPrompt = null;
        }
        // Recorded because the event does not replay: it can fire in the gap
        // before React mounts, and src/utils/useInstallNotification.js — which
        // is what turns this into the "OquNet is on your home screen" message —
        // would otherwise never learn it happened.
        window.appInstalled = true;
      });
    </script>
  </body>
</html>
